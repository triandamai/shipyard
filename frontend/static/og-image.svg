<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Drydock: graphite ground, one signal orange, IBM Plex with system fallbacks. -->
  <rect width="1200" height="630" fill="#141619"/>
  <!-- Concrete slab on the right with a 24px dot grid: the topology canvas. -->
  <rect x="780" y="0" width="420" height="630" fill="#1B1D21"/>
  <g fill="#2A2D32">
    <circle cx="804" cy="48" r="2"/><circle cx="852" cy="48" r="2"/><circle cx="900" cy="48" r="2"/><circle cx="948" cy="48" r="2"/><circle cx="996" cy="48" r="2"/><circle cx="1044" cy="48" r="2"/><circle cx="1092" cy="48" r="2"/><circle cx="1140" cy="48" r="2"/>
    <circle cx="804" cy="582" r="2"/><circle cx="852" cy="582" r="2"/><circle cx="900" cy="582" r="2"/><circle cx="948" cy="582" r="2"/><circle cx="996" cy="582" r="2"/><circle cx="1044" cy="582" r="2"/><circle cx="1092" cy="582" r="2"/><circle cx="1140" cy="582" r="2"/>
  </g>
  <!-- Three service nodes joined by connectors -->
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="18">
    <line x1="988" y1="196" x2="988" y2="268" stroke="#3A3E44" stroke-width="2"/>
    <line x1="988" y1="364" x2="988" y2="436" stroke="#3A3E44" stroke-width="2"/>
    <rect x="868" y="124" width="240" height="72" rx="6" fill="#17191C" stroke="#2A2D32" stroke-width="2"/>
    <circle cx="896" cy="160" r="6" fill="#4ADE80"/><text x="916" y="166" fill="#C3C6CA">web</text>
    <rect x="868" y="268" width="240" height="96" rx="6" fill="#17191C" stroke="#F26B1D" stroke-width="2"/>
    <rect x="860" y="260" width="256" height="112" rx="10" fill="none" stroke="#F26B1D" stroke-width="2"/>
    <circle cx="896" cy="316" r="6" fill="#4ADE80"/><text x="916" y="322" fill="#ECEDEE">postgres</text>
    <rect x="868" y="436" width="240" height="72" rx="6" fill="#17191C" stroke="#2A2D32" stroke-width="2"/>
    <circle cx="896" cy="472" r="6" fill="#60A5FA"/><text x="916" y="478" fill="#C3C6CA">api</text>
  </g>
  <!-- Mark -->
  <rect x="80" y="152" width="72" height="72" rx="10" fill="#22252A"/>
  <g transform="translate(92, 164) scale(2)" stroke="#F26B1D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
  </g>
  <text x="76" y="340" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="600" fill="#ECEDEE" letter-spacing="-3">Shipyard</text>
  <text x="80" y="398" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#C3C6CA">Self-hosted container orchestration for your VPS</text>
  <text x="80" y="440" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8B9097">Git deploys, automatic HTTPS, a live topology canvas.</text>
  <text x="80" y="574" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="18" fill="#8B9097">shipyard.trian.space</text>
</svg>
