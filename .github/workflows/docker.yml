name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'landing/**'
      - 'runtime/**'
      - 'scripts/install.sh'
      - 'scripts/update.sh'
      - 'scripts/patch.sh'
      - 'scripts/worker-setup.sh'
      - '.github/workflows/docker.yml'
      - '.github/workflows/ci.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# main  -> edge + <sha>            (never `latest`)
# vX.Y.Z -> X.Y.Z, X.Y, X          (pre-release tags: exact version only)
# There is deliberately no `latest`: installs pin an exact version so the
# updater can tell whether it is behind.

jobs:
  # A release tag must match the version compiled into the binary, so the
  # in-app updater (which compares versions) agrees with the registry.
  verify-version:
    name: Verify release version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches backend/Cargo.toml
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' backend/Cargo.toml | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version cargo=$cargo_version"
          test "$tag_version" = "$cargo_version" || { echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $cargo_version. Run scripts/release.sh."; exit 1; }

  # ── CI (fmt/clippy/build/test + frontend/landing typecheck) ────────────────
  ci:
    name: CI
    needs: [verify-version]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    uses: ./.github/workflows/ci.yml

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shipyard-backend
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set build metadata
        id: build-meta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "git_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "migrations_hash=$(find backend/crates/db/migrations -type f -name '*.sql' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            GIT_SHA=${{ steps.build-meta.outputs.git_sha }}
            BUILD_DATE=${{ steps.build-meta.outputs.build_date }}
            DOCKER_REPO=${{ secrets.DOCKERHUB_USERNAME }}/shipyard-backend
            MIGRATIONS_HASH=${{ steps.build-meta.outputs.migrations_hash }}

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shipyard-frontend
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Landing ────────────────────────────────────────────────────────────────
  landing:
    name: Landing
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync scripts
        run: |
          cp scripts/install.sh landing/static/install.sh
          cp scripts/worker-setup.sh landing/static/worker-setup.sh
          cp scripts/update.sh landing/static/update.sh
          cp scripts/patch.sh landing/static/patch.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shipyard-landing
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./landing
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  # ── Edge Runtime ───────────────────────────────────────────────────────────
  edge-runtime:
    name: Edge Runtime
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shipyard-edge-runtime
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edge-runtime
          cache-to: type=gha,mode=max,scope=edge-runtime

  # ── Deploy landing ─────────────────────────────────────────────────────────
  deploy-landing:
    name: Deploy Landing
    runs-on: ubuntu-latest
    needs: landing
    steps:
      - name: Trigger deployment via webhook
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.LANDING_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}'

  # ── GitHub Release (tags only) ─────────────────────────────────────────────
  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [backend, frontend, landing, edge-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes \
            --title "Shipyard ${GITHUB_REF_NAME#v}" \
            scripts/install.sh scripts/update.sh scripts/worker-setup.sh
