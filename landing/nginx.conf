server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Docs as Markdown (/docs/*.md) and the llms.txt files are for language
    # models and tools: serve them as text, not downloads.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300";
    }
    location ~ ^/llms(-full)?\.txt$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
}
