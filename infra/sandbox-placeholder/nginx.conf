# Shipyard sandbox cold-start responder.
#
# Traefik points every stopped sandbox's preview host at this service, so the
# "waking up" page is served for any path. The page POSTs to
# /apps/preview/<token>/start to trigger the auto-start — but that request
# arrives on the *preview* host, which Traefik routes here, not to the API.
# So this server also reverse-proxies /apps/ through to the real backend.
server {
    listen 8080;
    server_name _;

    # Resolve the backend at request time (Docker's embedded DNS), not at
    # config-load time — nginx's `proxy_pass` normally resolves its host once
    # at startup and refuses to boot at all if that fails. A variable target
    # forces per-request resolution instead, so this container still comes up
    # and serves the static page even in a topology (e.g. local dev, where the
    # API runs on the host, not in a container) where "shipyard-backend" isn't
    # resolvable yet — the /apps/ proxy alone 502s until that's wired up,
    # rather than crash-looping the whole responder.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /apps/ {
        set $sandbox_api "shipyard-backend:3001";
        proxy_pass http://$sandbox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the cold-start page itself.
    location / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
