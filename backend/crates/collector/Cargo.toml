[package]
name = "shipyard-collector"
version.workspace = true
edition.workspace = true

# Collector: follows Docker container logs, tails Traefik access logs, and samples container resource stats.

[dependencies]
shipyard-common = { path = "../common" }
shipyard-observability = { path = "../observability" }
shipyard-docker = { path = "../docker" }
bollard = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["time"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tempfile = "3"
